<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Quattrocento+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --bg-card:#111111; --bg-elev:#1a1a1a; --border:#3a3a3a;
  --text:#eef0f3; --text-dim:#8b93a3; --heading:#c7cddb;
  --accent:#ffd400; --accent-dark:#4a3d00;
  --complete:#a855f7;
  --progress:var(--accent);
  --amber:#ffc247; --amber-dark:#4a3512;
  --imdb:#f5c518; --rt:#fa320a;
  --green:#66cc00; --red:#ff3f3f;
  --rw-inc:var(--green); --rw-dec:var(--red);
  --radius:16px;
  --page-width:1200px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#303030;color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;scrollbar-width:none;-ms-overflow-style:none;overflow-x:hidden}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
button,input{font-family:inherit;color:inherit}
@supports(-webkit-touch-callout:none){input,select,textarea{font-size:16px!important}}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#shell{display:flex;flex-direction:column;height:100vh;height:100dvh;align-items:center;gap:0;overflow-x:hidden;width:100%}
#main{overflow-x:clip;display:flex;flex-direction:column;min-height:0;min-width:0;flex:1;order:1;width:100%;max-width:var(--page-width);background:var(--bg);margin:0}
.explore-search{position:sticky;top:0;z-index:5;display:flex;align-items:center;min-height:56px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar-search{flex:1;min-width:160px;max-width:none;display:flex;align-items:center;position:relative}
.topbar-search input{flex:1;min-width:0;padding-right:42px}
.search-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);flex-shrink:0;width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer}

.search-btn:hover{border-color:var(--accent);color:var(--accent)}
.search-btn svg{width:16px;height:16px}
#bottomnav{order:2;flex-shrink:0;display:flex;align-items:stretch;justify-content:center;gap:7.25%;background:#000;border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom));width:100%;max-width:var(--page-width);min-height:52px;margin:0}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:600;color:#5a5a5a;cursor:pointer;flex:0 0 15.94%;max-width:15.94%;min-height:40px;transition:color .15s ease}
.nav-item:hover{color:#9a9a9a}
.nav-item.active{background:none;color:#ffffff}
.nav-icon{display:flex;align-items:center;justify-content:center;width:23px;height:23px;flex-shrink:0;color:inherit}
.nav-icon svg{width:100%;height:100%;display:block;stroke:currentColor}
.nav-label{font-size:10px;line-height:1.1;font-weight:600}
.brand{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;flex-shrink:0}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#2b1200;font-size:21px;font-family:'Poppins',sans-serif;font-weight:700;flex-shrink:0}
input[type=text]{width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;padding:10px 16px;font-size:14px}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]:focus,input[type=text]:focus-visible{outline:none}
.topbar-search input:focus,.topbar-search input:focus-visible{outline:none}
#outlet{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px 20px;scrollbar-width:none;-ms-overflow-style:none}
#outlet::-webkit-scrollbar{display:none}
.sub{color:var(--text-dim);margin:0 0 24px;font-size:14px}
.loading-row{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;pointer-events:none;margin:0;padding:0}
#bottomnav{position:relative;z-index:85}

.loading-glass{position:relative;width:min(250px,calc(100vw - 48px));height:92px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg-card) 75%,transparent);
  border:1px solid rgba(150,150,150,.4);
  animation:nx-glass-in .35s cubic-bezier(.22,1,.36,1) both}
.loading-text{position:relative;display:flex;align-items:center;justify-content:center;height:40px;line-height:40px;width:100%;text-align:center;margin-top:-14px}
.loading-text-words{display:inline-block;margin:0 2.5px;color:#fff;font-family:'Quattrocento Sans',sans-serif;font-size:14px;font-weight:700;filter:blur(0);animation:nx-blur-text 1.5s linear infinite}
.loading-line{position:absolute;left:50%;top:calc(100% + 6px);width:calc(100% - 64px);height:2px;transform:translateX(-50%);border-radius:2px;background:rgba(160,160,160,.5);overflow:hidden}

.lp .poster-progress{position:absolute;left:0;right:0;bottom:0;z-index:2}
.lp.has-prog .lp-name{bottom:6px;padding-bottom:4px}
.list-ov-body .cat-section{margin-bottom:18px}
.list-ov-body .cat-box{margin-bottom:12px}
.lp-name{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px 8px 6px;font-size:11px;font-weight:700;line-height:1.25;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.list-ov-body{display:flex;flex-direction:column}
.list-ov-body>*{flex-shrink:0}
.list-ov-body>.empty{margin:auto;width:100%;max-width:480px;flex-shrink:1}
.list-overlay .empty{margin:auto}
.lp-rw{position:absolute;top:6px;right:6px;z-index:3;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#2b1200;font-size:12px;font-weight:800;line-height:22px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4);pointer-events:none}

:root{--accent-text:var(--accent)}
html[data-theme="light"],html[data-theme="light"] .profile-edit-overlay{
  --bg:#f6f8fb; --bg-card:#fafbfd; --bg-elev:#eff1f5; --border:#dde1e8;
  --text:#161b27; --text-dim:#5a6477; --heading:#343c4e;
  --accent-text:#8a6a00; --accent-dark:#f0dc8a;
  --amber:#b86e00; --amber-dark:#ffe9bd; --imdb:#a8820a; --btn-gray:#e8ebf0; --cat-color:#2a3142;
}
html[data-theme="light"]{color-scheme:light}
html[data-theme="light"] .detail-hero-wrap,
html[data-theme="light"] .profile-hero{
  --bg:#000000; --bg-card:#111111; --bg-elev:#1a1a1a; --border:#3a3a3a;
  --text:#eef0f3; --text-dim:#8b93a3; --heading:#c7cddb;
  --accent-text:#ffd400; --accent-dark:#4a3d00;
  --amber:#ffc247; --amber-dark:#4a3512; --imdb:#f5c518;
}
html[data-theme="light"] .detail-hero-wrap{background:#1a1a1a}
html[data-theme="light"] .detail-hero-wrap,html[data-theme="light"] .profile-hero{color:#eef0f3}
html[data-theme="light"],html[data-theme="light"] body{background:#e6e9ef}
html[data-theme="light"]:not([data-style="glass"]) #bottomnav{background:#fffffe}
html[data-theme="light"] .nav-item{color:#8a909c}
html[data-theme="light"] .nav-item:hover{color:#4a505c}
html[data-theme="light"] .nav-item.active{color:#000000}
html[data-theme="light"] a,
html[data-theme="light"] code,
html[data-theme="light"] .msg.ok,
html[data-theme="light"] .see-more-btn,
html[data-theme="light"] .pill,
html[data-theme="light"] .search-add-btn,
html[data-theme="light"] .hscroll-head:hover .hscroll-title,
html[data-theme="light"] .season-group.open .season-chevron{color:var(--accent-text)}
html[data-theme="light"] .search-add-btn{border-color:var(--accent-text)}
html[data-theme="light"] .search-add-btn.on{background:var(--accent);color:#2b1200;border-color:var(--accent)}
html[data-theme="light"] .feed-item,
html[data-theme="light"] .season-panel,
html[data-theme="light"] .upcoming-row,
html[data-theme="light"] .upcoming-movie-row,
html[data-theme="light"] .stat-card2{background:#fffffe}
html[data-theme="light"] .season-toggle:hover{background:rgba(0,0,0,.03)}
html[data-theme="light"] #outlet.detail-view,
html[data-theme="light"] .detail-body,
html[data-theme="light"] .upcoming-list{background:#eef1f6}
html[data-theme="light"] .tab-ind{background:#161b27}
html[data-theme="light"] .section-h.profile-title,
html[data-theme="light"] .hscroll-title,
html[data-theme="light"] .modal-title{color:#161b27}
html[data-theme="light"] .upcoming-feed-item .upcoming-days-left{color:var(--text)}
html[data-theme="light"] .back{background:#fffffe;border-color:var(--border);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.12)}
html[data-theme="light"] .detail-hero-wrap .back{background:#3d3d3d;border-color:rgba(255,255,255,.4);color:#eef0f3}
html[data-theme="light"] .poster-overlay .name,
html[data-theme="light"] .poster-type{color:#ffffff}
html[data-theme="light"] .poster-rating{color:#f5c518}
html[data-theme="light"] .lib-popup,
html[data-theme="light"] .modal-card,
html[data-theme="light"] .rating-chip.imdb,
html[data-theme="light"] .rating-chip.rt{background:#3d3d3d}
html[data-theme="light"] .stat-card2,
html[data-theme="light"] .profile-list-pair .hscroll-section,
html[data-theme="light"] .feed-item,
html[data-theme="light"] .season-panel,
html[data-theme="light"] .upcoming-row,
html[data-theme="light"] .card{box-shadow:0 1px 3px rgba(30,40,60,.07)}
html[data-theme="light"] .profile-edit-overlay input[type=text]{background:var(--bg-elev);border-color:var(--border)}
html[data-theme="light"] .hscroll-count{background:var(--bg-elev)}
.hscroll-track,.profile-list-pair .hscroll-track{padding-bottom:14px;margin-bottom:-10px}
.hscroll-track .hscroll-item img{box-shadow:0 4px 10px -3px rgba(0,0,0,.5)}
html[data-theme="light"] .hscroll-track .hscroll-item img{box-shadow:0 4px 10px -3px rgba(30,40,60,.3)}
</style>

<script>
const K={prog:'nx.prog',apikey:'nx.apikey',omdb:'nx.omdb',token:'nx.token',exp:'nx.exp',lib:'nx.lib',movieLib:'nx.movieLib',watched:'nx.watched',movieWatched:'nx.movieWatched',favShows:'nx.favShows',favMovies:'nx.favMovies',rewatch:'nx.rewatch',epRewatch:'nx.epRewatch',seasonRewatch:'nx.seasonRewatch',profile:'nx.profile',stopped:'nx.stopped',showReg:'nx.showReg',movieReg:'nx.movieReg',tr:'nx.tr'};
let _progCache=null,_todayK='',_todayAt=0,showsDirty=false,moviesDirty=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lget(k,f){const r=localStorage.getItem(k);if(r===null)return f;try{return JSON.parse(r)}catch{return f}}
const _pk=new Map();
function lpeek(k,f){if(_pk.has(k))return _pk.get(k);const v=lget(k,f);_pk.set(k,v);return v}
function lset(k,v){
  try{localStorage.setItem(k,JSON.stringify(v))}
  catch(e){_pk.delete(k);return false}
  _pk.delete(k);
  if(k===K.lib||k===K.watched||k===K.stopped||k===K.prog||k===K.profile)showsDirty=true;
  if(k===K.movieLib||k===K.movieWatched||k===K.profile)moviesDirty=true;
  scheduleSync();return true;
}
window.addEventListener('storage',()=>{_pk.clear();_progCache=null});

let _idbP=null;
function idbOpen(){
  return _idbP||(_idbP=new Promise((res,rej)=>{
    const req=indexedDB.open('nextup-fs',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('kv');
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>{_idbP=null;rej(req.error)};
  }));
}
async function idbDel(key){try{const db=await idbOpen();return await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(key);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)})}catch{return false}}
async function idbGet(key){
  try{
    const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const rq=db.transaction('kv','readonly').objectStore('kv').get(key);
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error);
    });
  }catch{return null}
}
async function idbSet(key,val){
  try{
    const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const tx=db.transaction('kv','readwrite');
      tx.objectStore('kv').put(val,key);
      tx.oncomplete=()=>res(true);
      tx.onerror=()=>rej(tx.error);
    });
  }catch{return false}
}
let syncTimer=null;
function scheduleSync(){
  if(typeof FileSync==='undefined'||!FileSync.handle)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>FileSync.save(),400);
}
const FileSync={
  handle:null,
  supported:typeof window!=='undefined'&&'showSaveFilePicker' in window,
  async init(){
    if(!this.supported)return false;
    const h=await idbGet('fileHandle');
    if(!h)return false;
    try{
      const perm=await h.queryPermission({mode:'readwrite'});
      if(perm==='granted'){this.handle=h;return true}
    }catch{}
    this.handle=h;
    return false;
  },
  async chooseOrCreate(){
    if(!this.supported)return false;
    try{
      const h=await window.showSaveFilePicker({suggestedName:'tv-plus-data.txt',types:[{description:'Text file',accept:{'text/plain':['.txt']}}]});
      this.handle=h;
      await idbSet('fileHandle',h);
      await this.save();
      return true;
    }catch{return false}
  },
  async ensurePermission(){
    if(!this.handle)return false;
    const opts={mode:'readwrite'};
    try{
      if((await this.handle.queryPermission(opts))==='granted')return true;
      if((await this.handle.requestPermission(opts))==='granted')return true;
    }catch{}
    return false;
  },
  async save(){
    if(!this.handle)return false;
    if(!(await this.ensurePermission()))return false;
    try{
      const due=Date.now()-((await idbGet('bakAt'))||0)>6*3600e3;
      if(isLocalDataEmpty()||due){
        const cur=await this.load();
        const hasFile=!!cur&&fileHasData(cur);
        if(hasFile&&isLocalDataEmpty()){
          return false;
        }
        if(hasFile)await rotateBackup(cur);
      }
      const w=await this.handle.createWritable();
      await w.write(exportDataText());
      await w.close();
      return true;
    }catch{return false}
  },
  async load(){
    if(!this.handle)return null;
    if(!(await this.ensurePermission()))return null;
    try{return await (await this.handle.getFile()).text()}catch{return null}
  }
};
function showHasWatched(id){return Object.values(lpeek(K.watched,{})).some(r=>r&&typeof r==='object'&&String(r.showId)===String(id))}
function restoreWatchedShows(){
  const ids=new Set();
  Object.values(Store.watched()).forEach(r=>{if(r&&typeof r==='object'&&r.showId!=null)ids.add(String(r.showId))});
  const lib=lget(K.lib,{}),reg=Store.reg('show'),stopped=Store.stoppedMap();let ch=false;
  ids.forEach(id=>{
    if(lib[id]||!reg[id]||!reg[id].name)return;
    lib[id]={...reg[id],addedAt:Date.now()};stopped[`show:${id}`]=true;ch=true;
  });
  if(ch){lset(K.lib,lib);lset(K.stopped,stopped)}
  return ch;
}
function isLocalDataEmpty(){return [K.lib,K.movieLib,K.watched,K.movieWatched,K.favShows,K.favMovies].every(k=>!Object.keys(lget(k,{})).length)}
function fileHasData(t){return /\[(?:TVDB ID|tvdb|id):\s*\d+\]/i.test(t||'')}
async function rotateBackup(text){
  const b1=await idbGet('bak1');
  if(b1)await idbSet('bak2',b1);
  await idbSet('bak1',text);await idbSet('bakAt',Date.now());
}
async function latestBackup(){for(const k of ['bak1','bak2']){const t=await idbGet(k);if(fileHasData(t))return t}return null}
function downloadBackup(){
  const blob=new Blob([exportDataText()],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='tv-plus-data.txt';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);

function snapNav(bar){
  const cs=getComputedStyle(bar);
  return{rect:bar.getBoundingClientRect(),radius:cs.borderRadius,bg:cs.backgroundColor,bf:cs.backdropFilter,pad:cs.padding};
}
function morphNav(bar,snap){
  const D=760,EASE='cubic-bezier(.32,.72,.2,1)';
  const b=bar.getBoundingClientRect(),cs=getComputedStyle(bar);
  const box=r=>({left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  const fixed={position:'fixed',transform:'none',margin:'0px',maxWidth:'none',right:'auto',bottom:'auto'};
  bar.classList.add('nav-morph');
  const a=bar.animate([
    {...fixed,...box(snap.rect),borderRadius:snap.radius,backgroundColor:snap.bg,backdropFilter:snap.bf,padding:snap.pad},
    {...fixed,...box(b),borderRadius:cs.borderRadius,backgroundColor:cs.backgroundColor,backdropFilter:cs.backdropFilter,padding:cs.padding}
  ],{duration:D,easing:EASE});
  const pill=bar.querySelector('.nav-pill'),act=bar.querySelector('.nav-item.active');
  if(pill&&getComputedStyle(pill).display!=='none')pill.animate([{opacity:0},{opacity:1}],{duration:D,easing:'ease'});
  try{bar.animate([{opacity:0},{opacity:1}],{duration:D,easing:'ease',pseudoElement:'::after'})}catch{}
  cancelAnimationFrame(window._pillRaf);
  const t0=performance.now();
  (function f(){
    if(pill&&act&&getComputedStyle(pill).display!=='none'){
      const br=bar.getBoundingClientRect(),ar=act.getBoundingClientRect();
      pill.classList.add('no-anim');
      pill.style.width=ar.width+'px';
      pill.style.transform=`translateX(${ar.left-br.left}px)`;
    }
    if(performance.now()-t0<D+60)window._pillRaf=requestAnimationFrame(f);
    else{pill?.classList.remove('no-anim');updateNavPill(true)}
  })();
  const done=()=>{bar.classList.remove('nav-morph');updateNavPill(true)};
  a.onfinish=done;a.oncancel=done;
}
function switchStyle(st){
  const root=document.documentElement,bar=document.getElementById('bottomnav');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const snap=reduce?null:snapNav(bar);
  if(!reduce){
    root.classList.add('style-anim');
    clearTimeout(window._styleAnimT);
    window._styleAnimT=setTimeout(()=>root.classList.remove('style-anim'),1000);
  }
  Store.setProfile({style:st});
  applyStyle(st);
  if(snap)morphNav(bar,snap);else updateNavPill(true);
}

function browserTimeZone(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch{return ''}}
function tzLabel(z){
  let off='';
  try{
    const part=new Intl.DateTimeFormat('en',{timeZone:z,timeZoneName:'longOffset'}).formatToParts(new Date()).find(p=>p.type==='timeZoneName');
    off=part?part.value.replace('GMT','UTC'):'';
    if(off==='UTC')off='UTC+00:00';
  }catch{}
  return off?`(${off}) ${z.replace(/_/g,' ')}`:z.replace(/_/g,' ');
}

const ProfileImg={avatar:'',banner:''};
async function loadProfileImages(){
  const p=lget(K.profile,{});
  ProfileImg.avatar=p.avatar||'';ProfileImg.banner=p.banner||'';
  if(p.avatar||p.banner){
    const ok=(!p.avatar||await idbSet('profile.avatar',p.avatar))&&(!p.banner||await idbSet('profile.banner',p.banner));
    if(ok){delete p.avatar;delete p.banner;lset(K.profile,p)}
  }else{
    ProfileImg.avatar=(await idbGet('profile.avatar'))||'';ProfileImg.banner=(await idbGet('profile.banner'))||'';
  }
}
async function saveProfileImage(key,dataUrl){
  const ok=await idbSet('profile.'+key,dataUrl);
  if(ok)ProfileImg[key]=dataUrl;
  return ok;
}

const Store={
  apikey:()=>lget(K.apikey,''), setApikey:v=>lset(K.apikey,v),
  omdb:()=>lget(K.omdb,''), setOmdb:v=>lset(K.omdb,v),
  token:()=>lget(K.token,''), exp:()=>lget(K.exp,0),
  setSession:(t,ttl)=>{lset(K.token,t);lset(K.exp,Date.now()+ttl)},
  clearSession:()=>{localStorage.removeItem(K.token);localStorage.removeItem(K.exp);_pk.clear()},
  clearAll:()=>{[K.apikey,K.token,K.exp].forEach(k=>localStorage.removeItem(k));_pk.clear()},
  valid:()=>Boolean(lget(K.token,''))&&Date.now()<lget(K.exp,0),

  _libKey:kind=>kind==='movie'?K.movieLib:K.lib,
  lib:kind=>lget(Store._libKey(kind),{}),
  addLib:(kind,item)=>{const k=Store._libKey(kind);const l=lget(k,{});l[item.id]={...item,addedAt:Date.now()};lset(k,l);Store.upsertReg(kind,item)},
  rmLib:(kind,id)=>{
    if(kind==='show'&&showHasWatched(id)){Store.setStopped(kind,id,true);return}
    const k=Store._libKey(kind);const l=lget(k,{});delete l[id];lset(k,l);
  },
  inLib:(kind,id)=>Boolean(lpeek(Store._libKey(kind),{})[id]),

  _regKey:kind=>kind==='movie'?K.movieReg:K.showReg,
  reg:kind=>lget(Store._regKey(kind),{}),
  upsertReg:(kind,item)=>{
    if(!item||item.id==null)return;
    const k=Store._regKey(kind);
    const r=lget(k,{});
    const prev=r[item.id]||{};
    const clean={};
    Object.entries(item).forEach(([key,val])=>{if(val!==undefined&&val!==null)clean[key]=val});
    r[item.id]={...prev,...clean};
    lset(k,r);
  },

  _favKey:kind=>kind==='movie'?K.favMovies:K.favShows,
  fav:kind=>lget(Store._favKey(kind),{}),
  isFav:(kind,id)=>Boolean(lpeek(Store._favKey(kind),{})[id]),
  toggleFav:(kind,id,data)=>{const k=Store._favKey(kind);const f=lget(k,{});if(f[id])delete f[id];else f[id]={...data,favAt:Date.now()};lset(k,f);return Boolean(f[id])},
  rmFav:(kind,id)=>{const k=Store._favKey(kind);const f=lget(k,{});delete f[id];lset(k,f)},

  prog:()=>{if(!_progCache)_progCache=lget(K.prog,{});return _progCache},
  watched:()=>lget(K.watched,{}),
  isWatched:id=>Boolean(lpeek(K.watched,{})[id]),
  watchedAt:id=>{const v=lpeek(K.watched,{})[id];if(v==null)return 0;return typeof v==='number'?v:(v.at||0)},
  setWatched:(id,v,ctx={})=>{
    const w=Store.watched();
    if(v)w[id]={at:Date.now(),s:ctx.season??null,e:ctx.episode??null,r:ctx.runtime??null,showId:ctx.showId??null};
    else{delete w[id];const er=Store.epRewatch();if(er[id]){delete er[id];lset(K.epRewatch,er)}}
    lset(K.watched,w);
    if(v&&ctx.show)Store.upsertReg('show',ctx.show);
  },

  movieWatched:()=>lget(K.movieWatched,{}),
  isMovieWatched:id=>Boolean(lpeek(K.movieWatched,{})[id]),
  setMovieWatched:(id,v,extra={})=>{
    const w=Store.movieWatched();
    if(v)w[id]={runtime:extra.runtime||100,watchedAt:Date.now()};
    else delete w[id];
    lset(K.movieWatched,w);
    if(v&&extra.movie)Store.upsertReg('movie',extra.movie);
  },

  rewatch:()=>lget(K.rewatch,{show:{},movie:{}}),

const SEP='—'.repeat(35);

function fmtYMD(ts){
  if(!ts)return '';
  const d=new Date(ts);
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseYMD(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec((s||'').trim());
  if(!m)return 0;
  return new Date(+m[1],+m[2]-1,+m[3]).getTime();
}
function numLabel(n){
  return ' '+String(n).padStart(2,' ')+'.';
}
function aliasNames(item){
  const list=item&&item.aliases;
  if(!Array.isArray(list))return [];
  const out=[];
  list.forEach(a=>{const n=a&&a.name;if(n&&n!==item.name&&!out.includes(n))out.push(n)});
  return out;
}
function firstAlias(item){return aliasNames(item)[0]||''}
function secondAlias(item){return aliasNames(item)[1]||''}
function formatWatchedDuration(totalMinutes){
  const mins=Math.max(0,Math.round(totalMinutes||0));
  const d=Math.floor(mins/1440);
  const h=Math.floor((mins%1440)/60);
  const m=mins%60;
  const parts=[];
  if(d)parts.push(`${d}d`);
  if(h)parts.push(`${h}h`);
  if(m||!parts.length)parts.push(`${m}m`);
  return parts.join(' ');
}

function buildShowExportRows(){
  const watched=Store.watched();
  const reg=Store.reg('show');
  const lib=Store.lib('show');
  const groups=new Map();
  Object.entries(watched).forEach(([epId,rec])=>{
    if(!rec||typeof rec!=='object'||rec.showId==null)return;
    if(!groups.has(rec.showId))groups.set(rec.showId,[]);
    groups.get(rec.showId).push({epId,s:rec.s,e:rec.e,r:rec.r,at:rec.at});
  });
  const rows=[];
  groups.forEach((episodes,showId)=>{
    const show=reg[showId]||lib[showId];
    if(!show)return;
    episodes.sort((a,b)=>(a.s===0?1:0)-(b.s===0?1:0)||(a.s-b.s)||(a.e-b.e));
    const totalMin=episodes.reduce((sum,ep)=>{
      const runtime=ep.r||show.averageRuntime||42;
      const rw=Store.getEpRewatch(ep.epId);
      return sum+runtime*(1+rw);
    },0);
    rows.push({show,episodes,totalMin});
  });
  rows.sort((a,b)=>b.episodes.length-a.episodes.length||a.show.name.localeCompare(b.show.name));
  return rows;
}

function exportShowsSection(){

  const favorites=Object.keys(Store.fav('show')).length;
  const lines=[SEP,'SHOWS',SEP,
    `  Shows with episodes watched: ${rows.length}`,
    `  Following: ${following}`,

    if(ps)parts.push(`[progress:${ps.w}/${ps.t},${ps.x},${ps.lw},${ps.ra},${ps.nx||''}]`);
    parts.push(`[${episodes.length} eps watched]`);

function formatDurationFull(totalMinutes){
  const t=Math.max(0,Math.round(totalMinutes||0));
  const minutes=t%60;
  const totalHours=Math.floor(t/60);
  const hours=totalHours%24;
  const totalDays=Math.floor(totalHours/24);
  const years=Math.floor(totalDays/360);
  const rem=totalDays%360;
  const months=Math.floor(rem/30);
  const days=rem%30;
  return `${years} years, ${months} months, ${days} days, ${hours} hours, ${minutes} minutes`;
}

  if(!code){
    const guess=COUNTRIES.find(c=>c[2].includes(browserTimeZone()));
    if(guess){code=guess[0];if(!tz)tz=browserTimeZone()}
  }
  const c=COUNTRIES.find(x=>x[0]===code);
  if(!tz)tz=c?c[2][0]:getUserTimeZone();
  return{code,country:c,tz};
}
function showMinutesTotal(){
  const watched=Store.watched(),reg=Store.reg('show'),lib=Store.lib('show');

      if(rec.r)return rec.r;
      const sh=reg[rec.showId]||lib[rec.showId];

    }

  let t=0;
  Object.values(watched).forEach(rec=>{t+=rt(rec)});
  validEpRewatch().forEach(([id,n])=>{t+=n*rt(watched[id])});

function importAliasStrings(hit){
  const out=[hit&&hit.name];
  const list=hit&&hit.aliases;
  if(Array.isArray(list))list.forEach(a=>{if(typeof a==='string')out.push(a);else if(a&&a.name)out.push(a.name)});
  return out.filter(Boolean);
}
function pickBestSearchHit(hits,name,alt){
  if(!Array.isArray(hits)||!hits.length)return null;
  const norm=s=>(s||'').toLowerCase().trim();
  const exact=hits.filter(h=>norm(h.name)===norm(name));
  if(exact.length===1)return exact[0];
  if(exact.length>1){
    if(alt){
      const withAlt=exact.filter(h=>importAliasStrings(h).some(a=>norm(a)===norm(alt)));
      if(withAlt.length)return withAlt[0];
    }
    return exact[0];
  }
  if(alt){
    const byAlt=hits.filter(h=>importAliasStrings(h).some(a=>norm(a)===norm(alt)));
    if(byAlt.length)return byAlt[0];
  }
  return hits.length===1?hits[0]:null;
}
const _importShowCache=new Map(),_importMovieCache=new Map();
async function resolveImportShow(fileId,name,alt){
  const cacheKey=`${fileId??''}|${(name||'').toLowerCase()}`;
  if(_importShowCache.has(cacheKey))return _importShowCache.get(cacheKey);
  const p=(async()=>{
    if(fileId!=null){
      try{
        const s=await Api.seriesExtended(fileId);
        return{id:String(s.id),name:s.name,image:s.image,aliases:s.aliases,averageRuntime:s.averageRuntime};
      }catch(_e){ }
    }
    if(name){
      try{
        const hits=await Api.search(name,'series');
        const hit=pickBestSearchHit(hits,name,alt);
        if(hit){
          const hid=numericId(hit);
          try{
            const s=await Api.seriesExtended(hid);
            return{id:String(s.id),name:s.name,image:s.image,aliases:s.aliases,averageRuntime:s.averageRuntime};
          }catch(_e){
            return{id:String(hid),name:hit.name,image:hit.image_url};
          }
        }
      }catch(_e){ }
    }
    return{id:fileId!=null?String(fileId):name,name};
  })();
  _importShowCache.set(cacheKey,p);
  return p;
}

async function mapLimit(items,limit,fn){
  const out=new Array(items.length);
  let next=0;
  async function worker(){
    while(next<items.length){
      const cur=next++;
      out[cur]=await fn(items[cur],cur);
    }
  }
  await Promise.all(Array.from({length:Math.max(1,Math.min(limit,items.length))},worker));
  return out;
}

async function importDataText(text){
  const lines=(text||'').replace(/\r\n/g,'\n').split('\n');
  const isSep=l=>/^[-–—]{10,}\s*$/.test(l||'');

  function allAlts(str){const out=[];const re=/\[alt2?:\s*([^\]]*)\]/gi;let x;while((x=re.exec(str)))if(x[1].trim())out.push(x[1].trim());return out}
  function bracket(str,label){
    const re=new RegExp('\\['+label+':\\s*([^\\]]*)\\]');
    const m=re.exec(str);
    return m?m[1].trim():null;
  }
  function idOf(str){const m=/\[(?:TVDB ID|tvdb|id):\s*(\d+)\]/i.exec(str);return m?m[1]:null}
  function flag(str,label){return new RegExp('\\['+label+'\\]').test(str)}
  function parseFavoriteFlag(rest){
    const v=bracket(rest,'favorite');
    if(v!=null)return v.trim()==='1';
    return flag(rest,'favorite');
  }
  function nameBeforeBrackets(rest){
    const m=/\s\[(?:alt|tvdb|TVDB ID):/i.exec(rest);
    return (m?rest.slice(0,m.index):rest).trim();
  }

  function parseShowHeader(line){
    const m=/^\s*\d+\.\s+(.*)$/.exec(line);
    if(!m)return null;
    const rest=m[1];
    const id=idOf(rest);
    if(id==null)return null;
    return{
      id,
      name:nameBeforeBrackets(rest),
      alt:bracket(rest,'alt')||null,
      alts:allAlts(rest),
      following:flag(rest,'following'),
      stoppedFlag:flag(rest,'stopped watching'),
      favorite:parseFavoriteFlag(rest),
      progress:bracket(rest,'progress')
    };
  }
  function parseEpisodeLine(line){
    const m=/^\s*S(\d+)E(\d+)\s+\[(?:TVDB ID|id):\s*(\d+)\]\s+\[(\d+)min\]\s+\[([^\]]*)\]\s*$/i.exec(line);
    if(!m)return null;
    return{s:+m[1],e:+m[2],epId:m[3],runtime:+m[4],date:m[5]};
  }
  function parseMovieHeader(line){
    const m=/^\s*\d+\.\s+(.*)$/.exec(line);
    if(!m)return null;
    const rest=m[1];
    const id=idOf(rest);
    if(id==null)return null;
    const runtimeM=/\[(\d+)min\]/.exec(rest);
    const dateM=/\[(\d{4}-\d{2}-\d{2})\]/.exec(rest);
    return{
      id,
      name:nameBeforeBrackets(rest),
      alt:bracket(rest,'alt')||null,
      alts:allAlts(rest),
      runtime:runtimeM?+runtimeM[1]:null,
      date:dateM?dateM[1]:null,
      hasFavInfo:bracket(rest,'favorite')!=null,
      favorite:parseFavoriteFlag(rest)
    };
  }
  function parseWatchlistLine(line){
    const m=/^\s*\d+\.\s+(.*?)((?:\s\[alt2?:[^\]]*\]){0,2})\s\s\[(?:TVDB ID|tvdb):\s*(\d+)\]\s*$/i.exec(line);
    const alts=m?allAlts(m[2]):[];return m?{name:m[1].trim(),alt:alts[0]||null,alts,id:m[3]}:null;
  }
  function parseRewatchGroupHeader(line){
    if(/^\s*\d+\./.test(line))return null;
    const m=/^\s\s(.*?)(?:\s\[alt2?:[^\]]*\]){0,2}\s\s\[(?:TVDB ID|tvdb):\s*(\d+)\]\s*$/i.exec(line);
    return m?{name:m[1].trim(),id:m[2]}:null;
  }
  function parseRewatchEpisodeLine(line){
    const m=/^\s{3,}S(\d+)E(\d+)\s+\[TVDB ID:\s*(\d+)\]\s+\[(\d+)\]\s*$/i.exec(line);
    return m?{s:+m[1],e:+m[2],epId:m[3],count:+m[4]}:null;
  }

let _omdbActive=0;

const OMDB_MAX_CONCURRENT=4;
function _omdbPump(){

function omdbEnqueue(fn){

let _omdbFatalWarned=false;
async function omdbFetch(params){
  const key=(Store.omdb()||'').trim();
  if(!key)return null;
  return omdbEnqueue(async()=>{
    const qs=new URLSearchParams({...params,apikey:key});
    const res=await fetch(`https://www.omdbapi.com/?${qs.toString()}`,{method:'GET'});
    if(!res.ok){
      console.error('[tv plus] OMDb request failed',res.status,res.statusText);
      const err=new Error(`OMDb HTTP ${res.status}`);
      err.status=res.status;
      throw err;
    }
    const j=await res.json();
    if(j.Response==='False'){
      const msg=j.Error||'';
      const err=new Error(msg||'OMDb error');
      err.omdbError=msg;
      err.quotaExceeded=/limit reached/i.test(msg);
      err.badKey=/invalid api key/i.test(msg);
      if((err.quotaExceeded||err.badKey)&&!_omdbFatalWarned){
        _omdbFatalWarned=true;
        console.error(`[tv plus] OMDb ratings disabled for this session: ${msg}`+(err.quotaExceeded?' (free-tier daily limit - ratings will resume once it resets)':' (check the key in Profile settings)'));
      }else if(!err.quotaExceeded&&!err.badKey){
        console.warn('[tv plus] OMDb error:',msg);
      }
      throw err;
    }
    return j;
  });
}

const translationCache=new Map();
let _trQueue=Promise.resolve();
function needsTranslation(t){
  if(!t||isArabicText(t))return false;
  const letters=t.match(/\p{L}/gu)||[];
  const foreign=letters.filter(c=>!/[A-Za-z]/.test(c)).length;
  return foreign>0&&(t.length<=80||foreign/letters.length>=0.15);
}
async function translateChunkNormalized(chunk){
  try{
    const res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=auto|en`);
    if(!res.ok)throw new Error(`MyMemory HTTP ${res.status}`);
    const data=await res.json();
    if(data.responseStatus&&data.responseStatus!==200)throw new Error(data.responseDetails||'MyMemory error');
    const translated=data?.responseData?.translatedText;
    if(!translated)throw new Error('MyMemory returned no translation');
    return{translated,sourceLang:data?.matches?.[0]?.source||''};
  }catch(err){console.warn('[tv plus] MyMemory failed, trying Google:',err.message)}
  let lastErr;
  for(const host of ['translate.googleapis.com','translate.google.com']){
    try{
      const res=await fetch(`https://${host}/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(chunk)}`);
      if(!res.ok)throw new Error(`Translation HTTP ${res.status}`);
      const data=await res.json();
      return{translated:(data?.[0]||[]).map(seg=>seg[0]).join(''),sourceLang:data?.[2]||''};
    }catch(err){lastErr=err}
  }
  throw lastErr||new Error('All translation providers failed');
}
function translateToEnglish(text){
  if(translationCache.has(text))return Promise.resolve(translationCache.get(text));
  const saved=lpeek(K.tr,{})[text];
  if(saved){translationCache.set(text,saved);return Promise.resolve(saved)}
  const job=_trQueue.then(async()=>{
    if(translationCache.has(text))return translationCache.get(text);
    const chunks=text.match(/[\s\S]{1,450}(?:\s|$)/g)||[text];
    const parts=[];let sourceLang='';
    for(const chunk of chunks){const{translated,sourceLang:sl}=await translateChunkNormalized(chunk);parts.push(translated);sourceLang=sl||sourceLang}
    const result={text:parts.join(''),sourceLang};
    translationCache.set(text,result);
    try{const m={...lget(K.tr,{}),[text]:result};const keys=Object.keys(m);if(keys.length>400)keys.slice(0,keys.length-400).forEach(k=>delete m[k]);localStorage.setItem(K.tr,JSON.stringify(m));_pk.delete(K.tr)}catch{}
    await sleep(250);
    return result;
  });
  _trQueue=job.catch(()=>{});
  return job;
}
function isArabicText(text){
  if(!text)return false;
  const arabicChars=(text.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/g)||[]).length;
  const letterChars=(text.match(/[^\s\d.,!?;:'"()\-]/g)||[]).length;
  return letterChars>0&&arabicChars/letterChars>0.3;
}

  const el=document.querySelector(`#outlet .hscroll-section[data-route="${route}"]`);
  if(!el)return null;
  el.scrollIntoView({block:'nearest'});
  const r=el.getBoundingClientRect();
  return{left:r.left,top:r.top,width:r.width,height:r.height,radius:getComputedStyle(el).borderRadius||'16px'};
}
const _borderCol=()=>getComputedStyle(document.documentElement).getPropertyValue('--border').trim()||'#3a3a3a';
const _geo=r=>({left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
const _shadow=(on)=>{
  const d=document.documentElement.dataset;
  if(d.style==='glass')return '0 0 0 0 rgba(0,0,0,0)';
  return `0 0 0 1px ${_borderCol()}, 0 ${on?12:0}px ${on?32:0}px rgba(0,0,0,${on?.5:0})`;
};
const _bgOf=el=>el?getComputedStyle(el).backgroundColor:'transparent';
function removeListOverlay(){
  if(!_listOv)return;
  _listOv.io?.disconnect();
  clearTimeout(_listOv.loadTimer);
  document.removeEventListener('keydown',_listOv.onKey);
  window.removeEventListener('resize',_listOv.onResize);
  _listOv.panel.remove();_listOv.backdrop.remove();
  _listOv=null;
}
function sizeListOverlay(panel){
  const m=20,main=document.getElementById('main').getBoundingClientRect();
  const nav=document.getElementById('bottomnav');
  const bottom=nav?Math.max(main.bottom,nav.getBoundingClientRect().bottom):main.bottom;
  panel.style.left=(main.left+m)+'px';
  panel.style.top=(main.top+m)+'px';
  panel.style.width=Math.max(240,main.width-2*m)+'px';
  panel.style.height=Math.max(240,bottom-main.top-2*m)+'px';
  const inner=panel.firstElementChild;
  if(inner){inner.style.width=panel.style.width;inner.style.height=panel.style.height}
}
function openListOverlay(route){
  const def=LIST_DEFS[route];
  const items=def.items();
  const isShow=def.kind==='show';
  const catMode=route==='libshows';
  const backdrop=document.createElement('div');
  backdrop.className='list-backdrop';
  const panel=document.createElement('div');
  panel.className='list-overlay bglass';
  panel.setAttribute('role','dialog');
  panel.setAttribute('aria-label',def.title);
  const boxEl=document.querySelector(`#outlet .hscroll-section[data-route="${route}"]`);
  const iconHtml=boxEl?(boxEl.querySelector('.hscroll-icon,.hscroll-heart')?.outerHTML||''):'';
  const head=document.createElement('div');
  head.className='list-ov-head';
  head.innerHTML=`${iconHtml}<div class="list-ov-title">${def.title}</div><span class="hscroll-count">${items.length}</span>`;
  head.appendChild(backButton('stats'));
  const sep=document.createElement('div');
  sep.className='list-ov-sep';
  const body=document.createElement('div');
  body.className='list-ov-body';
  const frames=[],frameById=new Map();
  const secs={};
  let emptyEl=null;
  const makeFrame=item=>{
    const f=document.createElement('div');
    f.className='lp';f.setAttribute('role','button');f.tabIndex=0;
    f.dataset.pid=`${def.kind}:${item.id}`;
    f.dataset.src=item.image||'';
    const nm=document.createElement('div');
    nm.className='lp-name';
    nm.textContent=item.name||'Untitled';
    f.appendChild(nm);
    if(!isShow&&route==='libmovies'){
      const n=Store.getRewatch('movie',item.id);
      if(n>0){const b=document.createElement('div');b.className='lp-rw';b.textContent=n;b.title=`Rewatched ${n} time${n>1?'s':''}`;f.appendChild(b)}
    }
    if((route==='libshows'||route==='libmovies')&&Store.isFav(def.kind,item.id))f.insertAdjacentHTML('beforeend',favBadgeHtml());
    if(isShow)f.classList.add('has-prog');
    if(isShow)f.insertAdjacentHTML('beforeend','<div class="poster-progress"><div class="poster-progress-fill" style="width:0%"></div></div>');
    f.addEventListener('click',()=>nav(def.kind,{id:item.id}));
    frames.push(f);frameById.set(item.id,f);
    return f;
  };
  const insertByValue=(grid,f,sv)=>{
    f.dataset.sv=sv;
    const before=[...grid.children].find(el=>el!==f&&Number(el.dataset.sv||0)<sv);
    if(before)grid.insertBefore(f,before);else grid.appendChild(f);
  };
  const refreshSections=()=>{
    let any=false;
    Object.values(secs).forEach(x=>{const has=x.grid.children.length>0;x.sec.style.display=has?'':'none';if(has)any=true});
    if(emptyEl){emptyEl.style.display=any?'none':''}
  };
  const P=Store.prog();
  const applyProgress=(f,item)=>{
    const sum=P[item.id];
    if(!sum)return;
    updatePosterProgress(f,{...progressFromSummary(sum),stopped:Store.isStopped('show',item.id)});
  };
  const placeCat=(f,item)=>{
    const sum=P[item.id];
    if(!sum){secs.pending.grid.appendChild(f);return}
    const progress=progressFromSummary(sum);
    const stopped=Store.isStopped('show',item.id);
    let key;
    if(stopped)key='stopped';
    else if(progress.watched===0){f.remove();return}
    else if(progress.complete)key='completed';
    else if(progress.upToDate)key='uptodate';
    else key='watching';
    updatePosterProgress(f,{...progress,stopped});
    insertByValue(secs[key].grid,f,sum.ra||0);
  };
  if(!items.length){
  }else if(catMode){
    [{key:'watching',title:'WATCHING'},{key:'uptodate',title:'Up to date'},{key:'completed',title:'Completed'},{key:'stopped',title:'Stopped watching'},{key:'pending',title:'LOADING'}].forEach(c=>{
      const sec=document.createElement('div');
      sec.className='cat-section';
      sec.style.display='none';
      sec.innerHTML=`<div class="cat-box-wrap"><div class="cat-box">${c.title}</div></div>`;
      const grid=document.createElement('div');
      grid.className='lp-grid';
      sec.appendChild(grid);
      body.appendChild(sec);
      secs[c.key]={sec,grid};
    });
    items.forEach(item=>placeCat(makeFrame(item),item));
    refreshSections();
  }else{
    const grid=document.createElement('div');
    grid.className='lp-grid';
    const frag=document.createDocumentFragment();
    items.forEach(item=>{const f=makeFrame(item);frag.appendChild(f);if(isShow)applyProgress(f,item)});
    grid.appendChild(frag);
    body.appendChild(grid);
  }
  const inner=document.createElement('div');
  inner.className='list-ov-inner';
  inner.append(head,sep,body);
  panel.append(inner);
  sizeListOverlay(panel);
  document.body.append(backdrop,panel);
  backdrop.addEventListener('click',()=>nav('stats'));
  const onKey=e=>{if(e.key==='Escape')nav('stats')};
  const onResize=()=>sizeListOverlay(panel);
  document.addEventListener('keydown',onKey);
  window.addEventListener('resize',onResize);
  const ov=_listOv={panel,backdrop,route,body,frames,onKey,onResize,io:null,loadTimer:0,ghost:null};
  const startLoading=()=>{
    if(_listOv!==ov||ov.io||!frames.length)return;
    ov.io=new IntersectionObserver(es=>es.forEach(e=>{
      if(!e.isIntersecting)return;
      const f=e.target;ov.io.unobserve(f);
      if(!f.dataset.src)return;
      const img=new Image();
      img.alt='';img.decoding='async';
      img.onload=()=>img.classList.add('loaded');
      img.src=imgUrl(f.dataset.src,{thumb:true});
      f.insertBefore(img,f.firstChild);
    }),{root:body,rootMargin:'300px 0px'});
    frames.forEach(f=>ov.io.observe(f));
    if(!isShow)return;
    const todo=items.filter(it=>!P[it.id]||progSummaryStale(P[it.id]));
    mapLimit(todo,3,async it=>{
      if(_listOv!==ov)return;
      const f=frameById.get(it.id);
      try{
        const[eps,series]=await Promise.all([getEpisodes(it.id),Api.seriesExtended(it.id).catch(()=>null)]);
        saveShowProgress(it.id,eps,isEndedStatus(series));
      }catch{
        if(!P[it.id]&&catMode)f.remove();
        return;
      }
      if(_listOv!==ov)return;
      if(catMode)placeCat(f,it);else applyProgress(f,it);
      if(catMode)refreshSections();
    }).then(()=>{if(_listOv===ov&&catMode)refreshSections()});
  };
  const box=listBoxRect(route);
  const ease='cubic-bezier(.32,.72,0,1)',dur=560;
  const D0=box?dur*.35:120;
  const revealItems=()=>{
    const STEP=100,DUR=400;
    const fade=(el,delay)=>el.animate([{opacity:0},{opacity:1}],{duration:DUR,delay,easing:'ease-out',fill:'backwards'});
    const blocks=[];
    if(catMode){
      ['watching','uptodate','completed','stopped','pending'].forEach(k=>{
        const x=secs[k];
        if(x&&x.sec.style.display!=='none')blocks.push({pill:x.sec.querySelector('.cat-box-wrap'),grid:x.grid});
      });
    }else{
      const g=body.querySelector('.lp-grid');
      if(g)blocks.push({pill:null,grid:g});
    }
    let t=D0;
    blocks.forEach(blk=>{
      const cells=[...blk.grid.children].filter(f=>f.offsetParent).sort((p,q)=>(p.offsetTop-q.offsetTop)||(p.offsetLeft-q.offsetLeft));
      const rows=[];
      cells.forEach(f=>{
        const last=rows[rows.length-1];
        if(last&&Math.abs(last[0].offsetTop-f.offsetTop)<4)last.push(f);else rows.push([f]);
      });
      let rowStart=t;
      if(blk.pill){fade(blk.pill,t);rowStart=t+STEP}
      rows.forEach((row,r)=>row.forEach((f,c)=>fade(f,rowStart+r*STEP+c*STEP)));
      t=rowStart+Math.max(0,rows.length-1)*STEP+STEP;
    });
  };
  backdrop.animate([{opacity:0,backdropFilter:'blur(0px)',webkitBackdropFilter:'blur(0px)'},{opacity:1,backdropFilter:'blur(2.5px)',webkitBackdropFilter:'blur(2.5px)'}],{duration:dur*.8,easing:'ease-out'});
  if(box&&boxEl&&panel.animate){
    const F=panel.getBoundingClientRect();
    const ghost=document.createElement('div');
    ghost.className='profile-list-pair lov-ghost';
    ghost.style.width=box.width+'px';ghost.style.height=box.height+'px';
    ghost.appendChild(boxEl.cloneNode(true));
    panel.appendChild(ghost);
    ov.ghost=ghost;
    boxEl.style.visibility='hidden';
    const bgPanel=_bgOf(panel);
    panel.animate([
      {..._geo(box),borderRadius:box.radius,boxShadow:_shadow(false),backgroundColor:_bgOf(boxEl)},
      {..._geo(F),borderRadius:'18px',boxShadow:_shadow(true),backgroundColor:bgPanel}
    ],{duration:dur,easing:ease});
    if(document.documentElement.dataset.style==='glass'){
      const cs=getComputedStyle(document.documentElement);
      try{panel.animate([{boxShadow:cs.getPropertyValue('--rim-soft')},{boxShadow:cs.getPropertyValue('--rim')}],{duration:dur,easing:ease,pseudoElement:'::after'})}catch{}
    }
    ghost.animate([{opacity:1},{opacity:0,offset:.2},{opacity:0}],{duration:dur,easing:'linear',fill:'forwards'});
    inner.animate([{opacity:0},{opacity:1,offset:.2},{opacity:1}],{duration:dur,easing:"linear"});
    revealItems();
  }else{
    panel.animate?.([{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'none'}],{duration:320,easing:ease});
    revealItems();
  }
  ov.loadTimer=setTimeout(startLoading,box?dur*.5:200);
}
function closeListOverlay(){
  const ov=_listOv;
  if(!ov)return;
  _listOv=null;
  ov.io?.disconnect();
  document.removeEventListener('keydown',ov.onKey);
  window.removeEventListener('resize',ov.onResize);
  clearTimeout(ov.loadTimer);
  const{panel,backdrop}=ov;
  panel.style.pointerEvents='none';backdrop.style.pointerEvents='none';
  const box=panel.animate?listBoxRect(ov.route):null;
  const finish=()=>{
    panel.remove();backdrop.remove();
    const hb=document.querySelector(`#outlet .hscroll-section[data-route="${ov.route}"]`);
    if(hb)hb.style.visibility='';
  };
  if(!panel.animate){finish();return}
  const dur=440,ease='cubic-bezier(.4,0,.2,1)';
  backdrop.animate([{opacity:1,backdropFilter:'blur(2.5px)',webkitBackdropFilter:'blur(2.5px)'},{opacity:0,backdropFilter:'blur(0px)',webkitBackdropFilter:'blur(0px)'}],{duration:dur,easing:'ease-in-out',fill:'forwards'});
  if(box&&ov.ghost){
    const F=panel.getBoundingClientRect();
    const inner=panel.firstElementChild;
    inner.animate([{opacity:1},{opacity:0,offset:.45},{opacity:0}],{duration:dur,easing:'linear',fill:'forwards'});
    ov.ghost.getAnimations().forEach(a=>a.cancel());
    ov.ghost.animate([{opacity:0},{opacity:0,offset:.5},{opacity:1}],{duration:dur,easing:'linear',fill:'forwards'});
    const a=panel.animate([
      {..._geo(F),borderRadius:'18px',boxShadow:_shadow(true),backgroundColor:_bgOf(panel)},
      {..._geo(box),borderRadius:box.radius,boxShadow:_shadow(false),backgroundColor:_bgOf(document.querySelector(`#outlet .hscroll-section[data-route="${ov.route}"]`))}
    ],{duration:dur,easing:ease,fill:'forwards'});
    if(document.documentElement.dataset.style==='glass'){
      const cs=getComputedStyle(document.documentElement);
      try{panel.animate([{boxShadow:cs.getPropertyValue('--rim')},{boxShadow:cs.getPropertyValue('--rim-soft')}],{duration:dur,easing:ease,fill:'forwards',pseudoElement:'::after'})}catch{}
    }
    a.onfinish=finish;a.oncancel=finish;
  }else{
    const a=panel.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.96)'}],{duration:260,easing:ease,fill:'forwards'});
    a.onfinish=finish;a.oncancel=finish;
  }
}
function updateNavPill(instant){
  const pill=document.querySelector('.nav-pill'),act=document.querySelector('#bottomnav .nav-item.active');
  if(!pill||!act)return;
  if(instant)pill.classList.add('no-anim');
  pill.style.width=act.offsetWidth+'px';
  pill.style.transform=`translateX(${act.offsetLeft}px)`;
  if(instant){pill.offsetWidth;requestAnimationFrame(()=>pill.classList.remove('no-anim'))}
}
function followNavPill(ms=800){
  const t0=performance.now();
  cancelAnimationFrame(window._pillRaf);
  (function f(){updateNavPill(true);if(performance.now()-t0<ms)window._pillRaf=requestAnimationFrame(f)})();
}

document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

document.addEventListener('keydown',e=>{

  if((e.key==='Enter'||e.key===' ')&&t.matches?.('[role="button"][tabindex]')&&t.tagName!=='BUTTON'){e.preventDefault();t.click()}

let _navFirst=true,_curHash='';
function setHash(h){_curHash=h;if(location.hash.slice(1)!==h)location.hash=h}
function nav(route,params={}){
  const prevRoute=currentRoute;
  const firstNav=_navFirst;_navFirst=false;
  if(_listOv){
    if(route==='stats'&&LIST_ROUTES.includes(prevRoute)){
      closeListOverlay();
      currentRoute='stats';
      setHash('stats');
      return;
    }
    removeListOverlay();
  }
  if(LIST_ROUTES.includes(route)){
    if(prevRoute!=='stats')nav('stats',{noAnim:true});
    openListOverlay(route);
    setHash(route);
    currentRoute=route;
    return;
  }
  if(route==='show')showBackRoute=SHOW_LIST_ROUTES.includes(currentRoute)?currentRoute:'shows';
  if(route==='movie')movieBackRoute=MOVIE_LIST_ROUTES.includes(currentRoute)?currentRoute:'movies';
  document.querySelectorAll('.nav-item').forEach(b=>{
    const r=b.dataset.route;
    const active=r===route||(r==='shows'&&route==='show')||(r==='movies'&&route==='movie');
    b.classList.toggle('active',active);
  });
  updateNavPill(firstNav);
  const outlet=document.getElementById('outlet');
  outlet.className='';
  outlet.innerHTML='';
  outlet.scrollTop=0;
  (routes[route]||renderExplore)(outlet,params);
  setHash(params.id?`${route}/${params.id}`:route);
  currentRoute=route;
}
window.addEventListener('hashchange',()=>{
  if(location.hash.slice(1)===_curHash)return;
  const{route,id}=hashRoute();
  nav(route,{id,noAnim:true});
});
function hashRoute(){
  const[r,id]=location.hash.replace('#','').split('/');
  const map={dashboard:'explore',search:'explore',library:'shows'};
  return{route:map[r]||r||'shows',id};
}

async function doExploreSearch(q,el){
  if(!q)return;
  if(!Store.valid()&&!Store.apikey()){el.innerHTML=emptyState('Connect your TVDB API key in your Profile first.','stats');return}
  el.innerHTML=loadingHtml('Searching…');
  try{
    const rs=await Promise.allSettled([Api.search(q,'series'),Api.search(q,'movie')]);
    if(rs.every(r=>r.status==='rejected'))throw rs[0].reason;
    const[seriesHits,movieHits]=rs.map(r=>r.status==='fulfilled'?(r.value||[]):[]);
    if(!seriesHits.length&&!movieHits.length){el.innerHTML=emptyState(`Nothing found for "${esc(q)}".`);return}
    const combined=[];
    const maxLen=Math.max(seriesHits.length,movieHits.length);
    for(let i=0;i<maxLen;i++){
      if(seriesHits[i])combined.push({hit:seriesHits[i],kind:'series'});
      if(movieHits[i])combined.push({hit:movieHits[i],kind:'movie'});
    }
    el.innerHTML='<div id="mixed-results" class="search-results-list"></div>';
    const list=el.querySelector('#mixed-results');
    combined.forEach(({hit:h,kind},i)=>{
      const id=numericId(h);
      const row=searchResultRow({id,name:h.name,image:h.image_url,kind});
      list.appendChild(row);
      row.animate?.([{opacity:0},{opacity:1}],{duration:400,delay:i*100,easing:'ease-out',fill:'backwards'});
    });
  }catch(err){el.innerHTML=emptyState(esc(err.message))}
}

const STALE_MS=7*24*60*60*1000;
let showsTabState='watchlist';
const watchlistPane=document.createElement('div');
const upcomingPane=document.createElement('div');
watchlistPane.style.cssText='flex:1;display:flex;flex-direction:column;min-height:0';
upcomingPane.style.cssText='flex:1;display:flex;flex-direction:column;min-height:0';
let watchlistLoaded=false,upcomingLoaded=false;
function bumpShowsCache(){
  watchlistLoaded=false;upcomingLoaded=false;
  watchlistPane.innerHTML='';upcomingPane.innerHTML='';
}
function ensureShowsTabLoaded(){
  if(showsTabState==='watchlist'&&!watchlistLoaded){watchlistLoaded=true;renderWatchListTab(watchlistPane);}
  if(showsTabState==='upcoming'&&!upcomingLoaded){upcomingLoaded=true;renderUpcomingTab(upcomingPane);}
}
function switchPane(from,to,dir,show,commit){
  const D=dir||1,host=from.parentElement;
  if(commit)commit();
  if(!from.animate||!to.animate||from.style.display==='none'){from.style.display='none';to.style.display=show;return}
  host.style.position='relative';
  to.style.display=show;
  Object.assign(from.style,{position:'absolute',left:'0',top:'0',width:'100%'});
  const T={duration:380,easing:'cubic-bezier(.32,.72,.2,1)'};
  const out=from.animate([{transform:'none'},{transform:`translateX(${-D*100}%)`}],{...T,fill:'forwards'});
  to.animate([{transform:`translateX(${D*100}%)`},{transform:'none'}],T);
  let done=false;
  const end=()=>{
    if(done)return;done=true;
    from.style.display='none';
    Object.assign(from.style,{position:'',left:'',top:'',width:''});
    host.style.position='';
    out.cancel();
  };
  out.onfinish=end;out.oncancel=end;
}
async function renderShows(o){

  o.classList.add('shows-route');

    <div class="shows-page">
      <div class="shows-tabs ${showsTabState==='upcoming'?'upcoming-active tab-up':''}">
        <button type="button" class="shows-tab ${showsTabState==='watchlist'?'active':''}" data-tab="watchlist">WATCH LIST</button>
        <button type="button" class="shows-tab ${showsTabState==='upcoming'?'active':''}" data-tab="upcoming">UPCOMING</button><span class="tab-ind"></span>
      </div>
      <div id="shows-tab-body"></div>
    </div>`;
  const body=o.querySelector('#shows-tab-body');
  body.appendChild(watchlistPane);
  body.appendChild(upcomingPane);
  function updatePaneVisibility(){
    watchlistPane.style.display=showsTabState==='watchlist'?'flex':'none';
    upcomingPane.style.display=showsTabState==='upcoming'?'flex':'none';
  }
  updatePaneVisibility();
  o.querySelectorAll('.shows-tab').forEach(btn=>btn.addEventListener('click',()=>{
    if(showsTabState===btn.dataset.tab)return;
    showsTabState=btn.dataset.tab;
    o.querySelectorAll('.shows-tab').forEach(b=>b.classList.toggle('active',b===btn));
    const toUp=showsTabState==='upcoming';
    o.querySelector('.shows-tabs').classList.toggle('tab-up',toUp);
    ensureShowsTabLoaded();
    switchPane(toUp?watchlistPane:upcomingPane,toUp?upcomingPane:watchlistPane,toUp?1:-1,'flex',()=>{o.querySelector('.shows-tabs').classList.toggle('upcoming-active',toUp);o.classList.toggle('upcoming-route',toUp);document.getElementById('outlet').scrollTop=0});
  }));
  ensureShowsTabLoaded();
}
async function fetchShowWatchData(s){
  const sum=Store.prog()[s.id];
  const fromSum=()=>({progress:progressFromSummary(sum),lastWatchedAt:sum.lw,mostRecentAiredAt:sum.ra});
  if(sum&&!progSummaryStale(sum)&&sum.l!==undefined)return fromSum();
  try{
    const[eps,series]=await Promise.all([getEpisodes(s.id),Api.seriesExtended(s.id).catch(()=>null)]);
    const ended=isEndedStatus(series);
    saveShowProgress(s.id,eps,ended);
    return{progress:calcShowProgress(eps,ended),lastWatchedAt:calcLastWatchedAt(eps),mostRecentAiredAt:calcMostRecentAiredAt(eps)};
  }catch(err){
    if(sum)return fromSum();
    throw err;
  }
}
function classifyForWatchlist(s,data,now){
  if(!data)return null;
  const{progress,lastWatchedAt,mostRecentAiredAt}=data;
  if(!progress.total)return null;
  if(progress.complete||progress.upToDate)return null;
  const key=progress.watched===0?'notstarted':(now-lastWatchedAt>=STALE_MS?'stale':'next');
  return{
    key,
    sortValue:mostRecentAiredAt,
    render:()=>{
      const card=posterCard({id:s.id,name:s.name,image:s.image,sub:'Tracking',kind:'series'});
      updatePosterProgress(card,{...progress,stopped:false});
      return card;
    }
  };
}

async function waitVisible(el){for(let i=0;i<60&&!el.offsetParent;i++)await new Promise(r=>setTimeout(r,50))}
function staggerFadeGrid(grid){
  if(!grid.animate)return;
  const cells=[...grid.children].filter(c=>c.offsetParent).sort((p,q)=>(p.offsetTop-q.offsetTop)||(p.offsetLeft-q.offsetLeft));
  const rows=[];
  cells.forEach(c=>{const last=rows[rows.length-1];if(last&&Math.abs(last[0].offsetTop-c.offsetTop)<4)last.push(c);else rows.push([c])});
  rows.forEach((row,r)=>row.forEach((c,i)=>c.animate([{opacity:0},{opacity:1}],{duration:400,delay:(r+i)*100,easing:'ease-out',fill:'backwards'})));

async function renderMovieWatchlistTab(o){

  o.insertAdjacentHTML('beforeend',loadingHtml('Loading…'));

  const reg=Store.reg('movie');
  const released=[];
  const known=m=>(reg[m.id]&&reg[m.id].releaseDate)||m.releaseDate||null;
  const needFetch=[];
  stubs.forEach(m=>{
    const rd=known(m);
    if(rd){if(!isFuture(rd))released.push({...m,releaseDate:rd,year:m.year??(reg[m.id]&&reg[m.id].year)})}
    else needFetch.push(m);
  });
  const fetchOne=async m=>{
    const ext=await Api.movieExtended(m.id);
    const releaseDate=firstReleaseDate(ext);
    if(releaseDate)Store.upsertReg('movie',{id:m.id,releaseDate,year:ext.year});
    return{released:!releaseDate||!isFuture(releaseDate),m:{...m,releaseDate,year:ext.year??m.year}};
  };
  await loadAllItems(needFetch,fetchOne,({stub:m,data})=>{
    if(data&&data.released)released.push(data.m);
    else if(!data)released.push(m);
  });
  o.querySelector('.loading-row')?.remove();
  if(!released.length){gridHost.innerHTML=emptyState('You are not tracking any released movies.','explore','Explore movies');return}

    if(ka&&!kb)return -1;
    if(!ka&&kb)return 1;
    return (order.get(a.id)||0)-(order.get(b.id)||0);
  });
  sorted.forEach(m=>{
    const card=posterCard({id:m.id,name:m.name,image:m.image,sub:'Tracking',kind:'movie'});
    card.dataset.sortKey=movieReleaseKey(m)||'';
    grid.appendChild(card);
  });
  await waitVisible(grid);
  staggerFadeGrid(grid);
}

        const k=Math.min(1,(now-t0)/1000);
        el.textContent=fmt(Math.round(target*(1-Math.pow(1-k,4))));
        if(k<1)requestAnimationFrame(tick);
      })(t0);
    });
  }
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitStats);
  window.addEventListener('resize',function onRs(){
    if(!statsGrid.isConnected){window.removeEventListener('resize',onRs);return}
    fitStats();
  });
}

const LOAD_CONCURRENCY=6;
async function loadAllItems(stubs,fetchItemData,onResult){
  await mapLimit(stubs,LOAD_CONCURRENCY,async stub=>{
    let data=null;
    try{data=await fetchItemData(stub)}catch{data=null}
    onResult({stub,data});
  });
}
function runCategorizedShowFeed(container,stubs,{fetchItemData,classify,grids,sections,onEmpty}){
  const spinnerWrap=document.createElement('div');
  spinnerWrap.innerHTML=loadingHtml('Loading…');
  container.appendChild(spinnerWrap);
  let count=0;
  loadAllItems(stubs,fetchItemData,({stub,data})=>{
    const c=classify(stub,data);
    if(!c)return;
    count++;
    const card=c.render();
    const sv=c.sortValue||0;
    card.dataset.sortValue=sv;
    const grid=grids[c.key];
    const before=[...grid.children].find(el=>Number(el.dataset.sortValue||0)<sv);
    if(before)grid.insertBefore(card,before);else grid.appendChild(card);
    sections[c.key].style.display='';
  }).then(()=>{
    spinnerWrap.remove();
    if(!count&&onEmpty)onEmpty();
  });
}

  return Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'),g('second'))-Math.floor(ts/1000)*1000;
}
function zonedToUtc(dateStr,h,m,tz){
  const [y,mo,d]=dateStr.split('-').map(Number);
  const guess=Date.UTC(y,mo-1,d,h,m,0);
  try{
    let ts=guess-tzOffsetMs(guess,tz);
    ts=guess-tzOffsetMs(ts,tz);
    return ts;
  }catch{return guess}
}
const _dkf=new Map();
function dateKeyInTz(ts,tz){
  try{
    let f=_dkf.get(tz);if(!f){f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'});_dkf.set(tz,f)}
    const parts=f.formatToParts(new Date(ts));
    const g=t=>parts.find(p=>p.type===t).value;
    return `${g('year')}-${g('month')}-${g('day')}`;
  }catch{return new Date(ts).toISOString().slice(0,10)}
}
function dayDiffKeys(a,b){
  const t=k=>{const [y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d)};
  return Math.round((t(a)-t(b))/86400000);
}
function parseAirsTime(t){
  const m=/(\d{1,2}):(\d{2})\s*(am|pm)?/i.exec(t||'');
  if(!m)return null;
  let h=+m[1];const min=+m[2];
  if(m[3]){const pm=m[3].toLowerCase()==='pm';h=h%12+(pm?12:0)}
  if(h>23||min>59)return null;
  return{h,m:min};
}
function seriesSourceTz(series){
  const code=countryCodeFrom(series?.originalNetwork?.country)||countryCodeFrom(series?.latestNetwork?.country)||countryCodeFrom(series?.originalCountry);
  return sourceTzForCountry(code);
}
function airInstant(dateStr,airsTime,srcTz){
  const userTz=getUserTimeZone();
  const t=parseAirsTime(airsTime);
  if(t)return{ts:zonedToUtc(dateStr,t.h,t.m,srcTz||userTz),timed:true};
  return{ts:zonedToUtc(dateStr,0,0,userTz),timed:false};
}
function userReleaseDate(ext){
  const mine=getUserCountry();
  const list=(ext?.releases||[]).filter(r=>r.date);
  if(mine){
    const own=list.filter(r=>countryCodeFrom(r.country)===mine).map(r=>r.date).sort()[0];
    if(own)return own;
  }
  return firstReleaseDate(ext);
}
function countdownLabel(ts,timed){
  const diff=ts-Date.now();
  const tz=getUserTimeZone();
  if(diff<=0)return timed?'Now':'Today';
  if(diff<86400000){
    const h=Math.floor(diff/3600000);
    return h<1?'<1h':`${h}h`;
  }
  return `${Math.max(1,dayDiffKeys(dateKeyInTz(ts,tz),dateKeyInTz(Date.now(),tz)))}d`;
}
function fmtLocalTime(ts){
  try{return new Intl.DateTimeFormat('en-US',{timeZone:getUserTimeZone(),hour:'numeric',minute:'2-digit'}).format(new Date(ts))}catch{return null}
}

      if(!seasonEps.length)return;

      const minCount=done?Math.min(...aired.map(ep=>Store.getEpRewatch(ep.id))):0;

function youtubeVideoId(url){
  if(!url)return null;
  try{
    const u=new URL(url);
    if(u.hostname.includes('youtu.be'))return u.pathname.slice(1)||null;
    if(u.hostname.includes('youtube.com')){
      if(u.pathname==='/watch'&&u.searchParams.get('v'))return u.searchParams.get('v');
      if(u.pathname.startsWith('/embed/'))return u.pathname.slice('/embed/'.length)||null;
    }
  }catch{}
  return null;
}

      const v=!Store.isMovieWatched(movie.id);
      Store.setMovieWatched(movie.id,v,{runtime:movie.runtime,movie:movieItem});
      b.classList.toggle('btn-accent',v);
      b.textContent=v?'✓ Watched':'Mark watched';
      hero.querySelector('.rewatch-group')?.classList.toggle('hidden',!v);
      const favBtn=hero.querySelector('#fav-btn');
      if(favBtn)updateFavBtnUI(favBtn,'movie',movie.id,movieFavVisible);
      refreshMovieInPanes(movie.id,movieItem,{mayNowAppearInUpcoming:!v});
    });
    wireRewatchGroup(hero.querySelector('.rewatch-group'),{
      inc:()=>Store.bumpRewatch('movie',movie.id),
      dec:()=>Store.decRewatch('movie',movie.id)
    });
    attachRatings(hero,movie);
    const body=document.createElement('div');
    body.className='detail-body';
    const cast=(movie.characters||[]).filter(c=>c.personName||c.name);
    if(cast.length){
      const castGroup=document.createElement('div');
      castGroup.className='season-group cast-group';
      const castPanel=document.createElement('div');
      castPanel.className='season-panel';
      castPanel.innerHTML=`
        <div class="season-toggle" role="button" tabindex="0" aria-expanded="false">
          <span class="season-toggle-left">
            <div class="season-toggle-title-row">
              <div class="season-toggle-title">Cast</div>
              <span class="season-count">${cast.length}</span>
            </div>
          </span>
          <svg class="season-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>`;
      const castBox=document.createElement('div');
      castBox.className='season-episodes';
      const castTrack=document.createElement('div');
      castTrack.className='cast-track';
      cast.forEach(c=>{
        const item=document.createElement('div');
        item.className='cast-item';
        const role=c.name||c.peopleType||'';
        item.innerHTML=`
          <img class="cast-photo" loading="lazy" src="${imgUrl(c.image||c.personImgURL,{thumb:true})}" alt="${esc(c.personName)}" />
          <div class="cast-name">${esc(c.personName)}</div>
          <div class="cast-role">${role}</div>`;
        castTrack.appendChild(item);
      });
      castBox.appendChild(castTrack);
      castGroup.appendChild(castPanel);
      castGroup.appendChild(castBox);
      const castToggle=castPanel.querySelector('.season-toggle');
      const flipCast=()=>{
        const open=castGroup.classList.toggle('open');
        castToggle.setAttribute('aria-expanded',open);
      };
      castToggle.addEventListener('click',flipCast);
      castToggle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flipCast()}});
      body.appendChild(castGroup);
    }
    const trailer=(movie.trailers||[])[0];
    if(trailer?.url){
      const trailerH=document.createElement('div');
      trailerH.className='section-h';
      trailerH.textContent='Trailer';
      body.appendChild(trailerH);
      const vid=youtubeVideoId(trailer.url);
      if(vid){
        const originParam=(location.origin&&location.origin!=='null')?`&origin=${encodeURIComponent(location.origin)}`:'';
        const wrap=document.createElement('div');
        wrap.className='trailer-embed-wrap';
        wrap.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&playsinline=1${originParam}" title="Trailer" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        body.appendChild(wrap);
      }else{
        body.insertAdjacentHTML('beforeend',`<a class="btn" href="${trailer.url}" target="_blank" rel="noopener">▶ Watch trailer</a>`);
      }
    }
    if(body.children.length)content.appendChild(body);
  }catch(err){
    o.className='';
    content.style.paddingTop='';
    content.innerHTML='';
    content.appendChild(backButton(movieBackRoute));
    content.insertAdjacentHTML('beforeend',emptyState(err.message));
  }
}

document.querySelectorAll('.nav-item[data-route]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.route!==currentRoute)nav(b.dataset.route)}));
(function navCompact(){
  const bar=document.getElementById('bottomnav'),outlet=document.getElementById('outlet');
  let scrolled=false,mouseHot=false,tapHot=false,tapT=0,raf=0;
  const follow=()=>{const t0=performance.now();cancelAnimationFrame(raf);(function f(){updateNavPill(true);if(performance.now()-t0<500)raf=requestAnimationFrame(f)})()};
  const apply=()=>{const c=scrolled&&!mouseHot&&!tapHot;if(bar.classList.contains('compact')!==c){bar.classList.toggle('compact',c);follow()}};
  let lastTop=0;
  outlet.addEventListener('scroll',()=>{
    const top=outlet.scrollTop,dy=top-lastTop;
    if(top<=24)scrolled=false;
    else if(dy>6)scrolled=true;
    else if(dy<-6)scrolled=false;
    if(Math.abs(dy)>6||top<=24)lastTop=top;
    apply();
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    const r=bar.getBoundingClientRect();
    const near=e.clientY>r.top-70&&e.clientY<r.bottom+20&&e.clientX>r.left-90&&e.clientX<r.right+90;
    if(near!==mouseHot){mouseHot=near;apply()}
  },{passive:true});
  bar.addEventListener('pointerdown',()=>{tapHot=true;apply();clearTimeout(tapT);tapT=setTimeout(()=>{tapHot=false;apply()},2500)});
})();
const runSearch=()=>{
  if(!searchInput.value.trim())return;
  const had=document.activeElement===searchInput;
  nav('explore');
  if(had)searchInput.focus({preventScroll:true});
};
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
searchBtn.addEventListener('click',runSearch);

const _posterTry={};let _posterBusy=false;
function applyRepairedItem(kind,id,d){
  [Store._libKey(kind),Store._favKey(kind),Store._regKey(kind)].forEach(key=>{
    const m=lget(key,{});
    const cur=m[id];
    if(!cur)return;
    const patch={aliasChecked:2};
    if(d.image&&!cur.image)patch.image=d.image;
    if(d.aliases&&d.aliases.length&&d.aliases.length>(cur.aliases||[]).length)patch.aliases=d.aliases;
    if(!cur.averageRuntime&&d.averageRuntime)patch.averageRuntime=d.averageRuntime;
    if(!cur.runtime&&d.runtime)patch.runtime=d.runtime;
    if(!cur.year&&d.year)patch.year=d.year;
    m[id]={...cur,...patch};
    lset(key,m);
  });
  if(!d.image)return;
  const pid=`${kind}:${id}`;
  document.querySelectorAll(`[data-pid="${pid}"]`).forEach(el=>{
    if(el.classList.contains('lp')){
      el.dataset.src=d.image;
      el.querySelector('img')?.remove();
      const img=new Image();img.alt='';img.decoding='async';
      img.onload=()=>img.classList.add('loaded');
      img.src=imgUrl(d.image,{thumb:true});
      el.insertBefore(img,el.firstChild);
    }else{
      const img=el.querySelector('img');
      if(img)img.src=imgUrl(d.image);
    }
  });
}
async function repairMissingPosters(){
  if(_posterBusy||document.hidden||!Store.valid())return;
  _posterBusy=true;
  try{
    const pending=[];
    ['show','movie'].forEach(kind=>{
      const seen=new Set();
      [lpeek(Store._libKey(kind),{}),lpeek(Store._favKey(kind),{}),lpeek(Store._regKey(kind),{})].forEach(map=>Object.values(map).forEach(it=>{
        if(!it||it.id==null||seen.has(String(it.id)))return;
        if(it.image&&(it.aliasChecked>=2||aliasNames(it).length>=2))return;
        seen.add(String(it.id));
        const key=`${kind}:${it.id}`;
        const t=_posterTry[key];
        if(t&&(t.n>=6||Date.now()<t.next))return;
        pending.push({kind,id:it.id,key});
      }));
    });
    for(const q of pending.slice(0,50)){
      const pt=_posterTry[q.key]||(_posterTry[q.key]={n:0});
      pt.n++;pt.next=Date.now()+Math.min(3600e3,30e3*2**pt.n);
      try{
        const d=q.kind==='movie'?await Api.movieExtended(q.id):await Api.seriesExtended(q.id);
        if(d){
          const have=(d.aliases||[]).map(a=>a&&a.name).filter(n=>n&&n!==d.name);
          if(have.length<2&&d.originalLanguage&&d.originalLanguage!=='eng'){
            try{
              const tr=q.kind==='movie'?await Api.movieTranslations(q.id,d.originalLanguage):await Api._get(`/series/${q.id}/translations/${d.originalLanguage}`);
              if(tr&&tr.name&&tr.name!==d.name&&!have.includes(tr.name))d={...d,aliases:[...(d.aliases||[]),{language:d.originalLanguage,name:tr.name}]};
            }catch{}
          }
          applyRepairedItem(q.kind,q.id,d);
        }
      }catch{}
    }
  }finally{_posterBusy=false}
}
async function offerRestore(){
  if(!FileSync.handle||!isLocalDataEmpty())return;
  const restore=async()=>{
    let t=await FileSync.load();
    if(!fileHasData(t))t=await latestBackup();
    if(!fileHasData(t)){return}
    try{await importDataText(t);const{route,id}=hashRoute();nav(route,{id,noAnim:true})}
    catch(err){}
  };
  if(await FileSync.handle.queryPermission?.({mode:'readwrite'})==='granted'){
    const t=await FileSync.load();
    if(!fileHasData(t)&&!fileHasData(await latestBackup()))return;
  }
  showConfirmDialog({title:'Restore your data?',message:'This device has no saved library, but a backup file is connected. Load it now?',confirmLabel:'Load backup',onConfirm:restore});
}
(async function boot(){
  applyTheme(Store.profile().theme);
  applyStyle(Store.profile().style);
  await FileSync.init();
  await loadProfileImages();
  pruneEpRewatch();
  restoreWatchedShows();
  const key=Store.apikey();
  if(key&&!Store.valid()){try{await Api.login(key)}catch{}}
  const{route,id}=hashRoute();
  nav(route,{id});
  offerRestore().catch(()=>{});
  setTimeout(repairMissingPosters,1500);
  setInterval(repairMissingPosters,60000);
})();
